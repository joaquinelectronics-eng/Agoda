# Toma muestras de precios cada 15 minutos, sin depender de que haya una
# computadora prendida. Corre en los runners de GitHub, que para un repo
# publico son gratis y sin limite de minutos.
#
# Cada 15 minutos y no cada hora a proposito: GitHub demora las tareas
# programadas cuando hay cola, y a veces se saltea alguna. Muestreando cuatro
# veces por hora quedan todas las horas cubiertas igual. El analisis usa la hora
# REAL de cada muestra, no la que estaba prevista, asi que una corrida que llega
# tarde sirve lo mismo.
#
# La base sqlite del runner se borra en cada corrida: lo que queda son los
# archivos de datos/ (uno por muestra, comprimidos), que al empezar se vuelven a
# cargar con "sincronizar" y al terminar se commitean.
name: muestra

on:
  schedule:
    # De 11:00 a 23:45 hora de Buenos Aires (UTC-3) => 14:00 a 02:45 UTC.
    - cron: '*/15 14-23,0-2 * * *'

  # Que entre una muestra nueva alcanza para rehacer la pagina. Sirve de red
  # cuando el cron de GitHub no dispara, que es bastante seguido.
  #
  # No hay bucle: los push que hace este mismo workflow van con GITHUB_TOKEN, y
  # GitHub no dispara workflows con los push hechos con ese token. Solo lo
  # despiertan los que vienen de afuera.
  push:
    paths:
      - 'datos/**'

  # Cuando termina una tanda de recoleccion, republicar la pagina con todo lo
  # que junto.
  workflow_run:
    workflows: [recolectar]
    types: [completed]

  workflow_dispatch:
    inputs:
      solo_pagina:
        description: Rehacer solo la pagina con lo ya guardado, sin buscar en Agoda
        default: 'false'

# Que dos corridas no se pisen: si una tarda mas de 15 minutos, la siguiente
# espera en vez de empujar commits sobre la misma rama al mismo tiempo.
concurrency:
  group: muestra
  cancel-in-progress: false

permissions:
  contents: write   # para commitear las muestras
  pages: write      # para publicar la pagina
  id-token: write

env:
  TZ: America/Argentina/Buenos_Aires
  AGODA_TZ: America/Argentina/Buenos_Aires
  # Las noches que muestra la pagina: hoy, manana y pasado.
  HORIZONTES: '0 1 2'
  FILTROS: --moneda USD --paginas todas --silencioso --serie datos
  SOLO: ${{ inputs.solo_pagina }}

jobs:
  muestra:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.pagina.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Este workflow es la red por si el recolector se muere, no un segundo
      # recolector. Si ya hay una muestra fresca, buscar de nuevo seria pedirle
      # a Agoda el doble de todo para guardar lo mismo, y lo unico que se gana
      # es acercarse a que nos corten.
      - name: ¿Hace falta buscar, o alcanza con republicar?
        id: falta
        run: |
          ultima=$(ls datos/*/*.json.gz 2>/dev/null | sed 's#.*/##' | sort | tail -1)
          buscar=si
          if [ -n "$ultima" ]; then
            iso=$(echo "${ultima%.json.gz}" | sed -E 's/T([0-9]{2})-([0-9]{2})-([0-9]{2})-[0-9]+Z/T\1:\2:\3Z/')
            edad=$(( $(date +%s) - $(date -d "$iso" +%s) ))
            echo "La ultima muestra es de hace $((edad / 60)) minutos."
            [ "$edad" -lt 2400 ] && buscar=no
          else
            echo "No hay ninguna muestra todavia."
          fi
          # A mano (workflow_dispatch) siempre se busca, salvo que pidan solo la pagina.
          [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ] && buscar=si
          [ "$SOLO" = 'true' ] && buscar=no
          echo "buscar=$buscar" >> "$GITHUB_OUTPUT"
          echo "Busco en Agoda: $buscar"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Navegador (cacheado entre corridas)
        if: steps.falta.outputs.buscar == 'si'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - if: steps.falta.outputs.buscar == 'si'
        run: node node_modules/playwright-core/cli.js install --with-deps chromium

      - name: Rearmar la base con las muestras ya guardadas
        run: node bin/agoda.mjs sincronizar

      - name: Las noches
        if: steps.falta.outputs.buscar == 'si'
        run: |
          for d in $HORIZONTES; do
            noche=$(date -d "+$d day" +%F)
            node bin/agoda.mjs buscar "Buenos Aires" $FILTROS --noche "$noche" || echo "!! fallo la noche +$d ($noche)"
          done

      - name: La pagina
        run: |
          # --pestanas toma UNA lista separada por comas, no la bandera repetida.
          noches=''
          for d in $HORIZONTES; do
            [ "$d" = 0 ] && continue
            noches="${noches:+$noches,}$(date -d "+$d day" +%F)"
          done
          solapa=()
          [ -n "$noches" ] && solapa=(--pestanas "$noches")
          mkdir -p sitio
          node bin/agoda.mjs reporte --noche hoy "${solapa[@]}" --html sitio/index.html

      # Antes de publicar: si algo falla mas adelante, los datos ya estan a salvo.
      - name: Guardar las muestras nuevas
        if: steps.falta.outputs.buscar == 'si'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add datos
          if git diff --cached --quiet; then
            echo "Sin muestras nuevas."
            exit 0
          fi
          git commit -m "Muestra de $(date '+%F %H:%M %Z')"
          # Puede haber entrado un commit mientras corriamos.
          for intento in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((intento * 5))
          done
          exit 1

      # Publicar la pagina es lo ultimo y va con continue-on-error: los datos ya
      # estan guardados y commiteados arriba, y un problema con Pages no puede
      # dar la corrida por fallida ni frenar la recoleccion.
      #
      # Nada de enablement: true. El token de Actions no puede CREAR el sitio de
      # Pages ("Resource not accessible by integration"); hay que prenderlo una
      # vez en Settings -> Pages -> Source: GitHub Actions.
      - uses: actions/configure-pages@v5
        continue-on-error: true

      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: sitio

      - id: pagina
        continue-on-error: true
        uses: actions/deploy-pages@v4
